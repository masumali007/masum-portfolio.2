    <!-- Error Catcher -->
    <script>
      window.addEventListener('error', function(e) {
        document.body.innerHTML += '<div style="position:fixed;top:0;left:0;z-index:999999;background:red;color:white;padding:20px;font-family:monospace;width:100%;height:100%;white-space:pre-wrap;">' + e.error.stack + '</div>';
      });
      window.addEventListener('unhandledrejection', function(e) {
        document.body.innerHTML += '<div style="position:fixed;top:0;left:0;z-index:999999;background:red;color:white;padding:20px;font-family:monospace;width:100%;height:100%;white-space:pre-wrap;">Unhandled Promise Rejection: ' + e.reason + '</div>';
      });
    </script>
